name: Paid audit check

# The paid path on prod once a week: a real audit with the test account's
# credits (CITED_SMOKE_AGENT_KEY), its report and its recommendations. About
# $10 of the test account's credits and $5 of AI a run. Opens an issue when
# it fails.
on:
  schedule:
    - cron: "23 14 * * 1" # Mondays, 14:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: paid-check
  cancel-in-progress: false

jobs:
  paid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install this branch
        run: |
          pip install -e packages/core
          pip install -e packages/mcp
          pip install -e ".[dev]"

      - name: Paid audit
        env:
          CITED_SMOKE_AGENT_KEY: ${{ secrets.CITED_SMOKE_AGENT_KEY }}
        run: |
          if [[ -z "$CITED_SMOKE_AGENT_KEY" ]]; then
            echo "::error::CITED_SMOKE_AGENT_KEY is not set, so the paid path was not checked"
            exit 1
          fi
          python -m pytest tests/live/test_paid.py --live --paid -v -p no:cacheprovider

      - name: Open an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Weekly paid audit check is failing"
          if [[ -z "$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number')" ]]; then
            gh issue create --title "$TITLE" --body "The weekly paid audit on api.youcited.com failed: $RUN_URL"
          fi
