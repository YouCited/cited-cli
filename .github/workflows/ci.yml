name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e packages/core
          pip install -e packages/mcp
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ packages/ scripts/

      - name: Type check
        run: mypy packages/core/src packages/mcp/src src/cited_cli/ --ignore-missing-imports

      - name: Test
        run: pytest -v --cov

  # Keychain, config paths and the browser opener differ by OS.
  test-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e packages/core
          pip install -e packages/mcp
          pip install -e ".[dev]"

      - name: Test
        run: pytest -v

  # Build the three packages and install them the way users do, not editable.
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build --outdir dist packages/core
          python -m build --outdir dist packages/mcp
          python -m build --outdir dist .

      - name: Install the wheels in a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          SMOKE_PY="$RUNNER_TEMP/smoke/bin/python"
          [[ -d "$RUNNER_TEMP/smoke/Scripts" ]] && SMOKE_PY="$RUNNER_TEMP/smoke/Scripts/python"
          "$SMOKE_PY" -m pip install dist/*.whl
          echo "SMOKE_PY=$SMOKE_PY" >> "$GITHUB_ENV"
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' packages/core/src/cited_core/__init__.py)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check the installed CLI and cited-mcp
        run: |
          "$SMOKE_PY" -I scripts/smoke_install.py --version "$VERSION"
          "$SMOKE_PY" -I scripts/smoke_install.py --version "$VERSION" --keychain-only

      # Before 0.8.0 a keychain prompt blocked the CLI and "Deny" crashed it.
      # With the keychain locked, every command must still finish.
      - name: Locked keychain (macOS)
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci-only "$RUNNER_TEMP/locked.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/locked.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/locked.keychain-db"
          security lock-keychain "$RUNNER_TEMP/locked.keychain-db"
          "$SMOKE_PY" -I scripts/smoke_install.py --version "$VERSION" --keychain-only

      - name: uv tool install
        run: |
          pip install uv
          uv tool install --find-links dist dist/cited_cli-*.whl
          "$(uv tool dir --bin)/cited" --version | grep -F "$VERSION"
