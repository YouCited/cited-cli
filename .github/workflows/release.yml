name: Release

# A release is a merged PR that bumps the version (scripts/bump_version.py).
# On that push to main this workflow publishes cited-core, cited-mcp and
# cited-cli to PyPI, creates the v<version> GitHub release and tag, publishes
# to the MCP Registry, then runs the live tests against the PyPI packages.
# Then it starts homebrew-cited's "Update formula" workflow for the new version.
#
# Pushing a v* tag (release.sh) still works. Every step is safe to re-run:
# uploads skip files already on PyPI and a version with a GitHub release is
# skipped, so run it by hand to finish a release that failed partway.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "packages/core/src/cited_core/__init__.py"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: Prod
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' packages/core/src/cited_core/__init__.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.v.outputs.publish == 'true'
        with:
          python-version: "3.12"

      # Build and publish in dependency order: core → mcp → cli
      - name: Build
        if: steps.v.outputs.publish == 'true'
        run: |
          pip install build twine
          python -m build --outdir dist/core packages/core
          python -m build --outdir dist/mcp packages/mcp
          python -m build --outdir dist/cli .

      - name: Publish to PyPI
        if: steps.v.outputs.publish == 'true'
        env:
          TWINE_NON_INTERACTIVE: "1"
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload --skip-existing dist/core/*
          twine upload --skip-existing dist/mcp/*
          twine upload --skip-existing dist/cli/*

      - name: Create GitHub release
        if: steps.v.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/cli/*
          generate_release_notes: true

  # Its own job so a hand run (workflow_dispatch) also publishes a version
  # that's already on PyPI but missing from the registry. Skips a version the
  # registry already has. Needs the youcited.com DNS key (YouCited/cited#245);
  # skipped until the MCP_REGISTRY_KEY secret exists.
  registry:
    needs: release
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Publish to the MCP Registry
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [[ -z "$MCP_REGISTRY_KEY" ]]; then
            echo "::warning::MCP_REGISTRY_KEY is not set, skipping the MCP Registry"
            exit 0
          fi
          NAME=$(jq -r .name server.json)
          if [[ "$(jq -r .version server.json)" != "$VERSION" ]]; then
            echo "::error::server.json is not at $VERSION (run scripts/bump_version.py)"
            exit 1
          fi
          URL="https://registry.modelcontextprotocol.io/v0/servers/${NAME//\//%2F}/versions/$VERSION"
          if curl -sf "$URL" -o /dev/null; then
            echo "$NAME $VERSION is already in the MCP Registry"
            exit 0
          fi
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/cited-mcp/$VERSION/json" -o /dev/null && break
            sleep 10
          done
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login dns --domain youcited.com --private-key "$MCP_REGISTRY_KEY"
          ./mcp-publisher publish server.json
          sleep 5
          curl -sf "$URL" -o /dev/null && echo "Published $NAME $VERSION" \
            || echo "::warning::Published, but the registry does not list $VERSION yet"

  # Starts homebrew-cited's "Update formula" workflow for this version, so the
  # tap updates right away instead of at its 6-hourly backstop check. Needs a
  # fine-grained token with Actions read/write on YouCited/homebrew-cited;
  # skipped until the HOMEBREW_TAP_TOKEN secret exists. Re-running it is safe:
  # the tap commits only when the formula changes.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Start the Homebrew formula update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the tap's 6-hourly check will pick up $VERSION"
            exit 0
          fi
          gh workflow run update-formula.yml --repo YouCited/homebrew-cited --ref main \
            -f version="$VERSION"
          echo "Started homebrew-cited's Update formula for $VERSION"

  verify:
    needs: release
    if: needs.release.outputs.publish == 'true'
    uses: ./.github/workflows/live.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
